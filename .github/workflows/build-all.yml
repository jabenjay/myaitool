name: Build Android APK & iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型'
        type: choice
        required: true
        default: 'release'
        options:
          - release
          - beta
          - pre-release
          - debug
      release_version:
        description: '填写发布版本号（如 0.3.12）'
        required: true
        default: '0.3.12'
      changelog:
        description: '单行快捷更新日志（留空则自动读取仓库根目录的 CHANGELOG.md 多行文件）'
        required: false
        default: ''
      ios_runner:
        description: '选择 iOS macOS 构建节点（arm64 拥堵时选 intel）'
        type: choice
        required: true
        default: 'macos-26-intel'
        options:
          - macos-26-intel
          - macos-15-intel
          - macos-latest
          - macos-26
          - macos-15

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Version & Changelog
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.ver.outputs.build_type }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      is_debug: ${{ steps.ver.outputs.is_debug }}
      tag: ${{ steps.ver.outputs.tag }}
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
      cfg: ${{ steps.ver.outputs.cfg }}
      changelog: ${{ steps.ver.outputs.changelog }}
      has_changelog: ${{ steps.ver.outputs.has_changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Build Version & Changelog
        id: ver
        env:
          INPUT_TYPE: ${{ github.event.inputs.build_type }}
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          BTYPE="${INPUT_TYPE:-release}"
          RAW="${INPUT_VERSION#v}"
          RAW="${RAW#V}"
          RAW="${RAW:-1.0.0}"

          if [ "$BTYPE" = "beta" ]; then
            TAG="v${RAW}-beta"
            IS_PRE="true"
            IS_DEBUG="false"
            CFG="Release"
          elif [ "$BTYPE" = "pre-release" ]; then
            TAG="v${RAW}-pre"
            IS_PRE="true"
            IS_DEBUG="false"
            CFG="Release"
          elif [ "$BTYPE" = "debug" ]; then
            TAG="v${RAW}-debug"
            IS_PRE="true"
            IS_DEBUG="true"
            CFG="Debug"
          else
            TAG="v${RAW}"
            IS_PRE="false"
            IS_DEBUG="false"
            CFG="Release"
          fi

          echo "build_type=${BTYPE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "is_debug=${IS_DEBUG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "cfg=${CFG}" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_CHANGELOG" ]; then
            FORMATTED=$(printf '%s' "$INPUT_CHANGELOG" | sed 's/；/;/g; s/;/\n- /g')
            NL=$(printf '\n')
            case "$FORMATTED" in
              -*|\#*|*"$NL"*) ;;
              *) FORMATTED="- $FORMATTED" ;;
            esac
            {
              echo "changelog<<EOF_CHANGELOG"
              printf '%s\n' "$FORMATTED"
              echo "EOF_CHANGELOG"
            } >> "$GITHUB_OUTPUT"
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          elif [ -f CHANGELOG.md ] && [ -s CHANGELOG.md ]; then
            {
              echo "changelog<<EOF_CHANGELOG"
              cat CHANGELOG.md
              echo ""
              echo "EOF_CHANGELOG"
            } >> "$GITHUB_OUTPUT"
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog=" >> "$GITHUB_OUTPUT"
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi

  build_android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare CI Signing Key
        if: needs.prepare.outputs.is_debug != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
            echo "Using keystore from GitHub Secret."
          elif [ -f app/ci-release.jks ]; then
            echo "Using committed app/ci-release.jks."
          else
            keytool -genkeypair -noprompt \
              -keystore app/ci-release.jks \
              -alias toolbox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass toolbox_ci_password -keypass toolbox_ci_password \
              -dname "CN=Jools, OU=CI, O=Jools, L=Local, ST=Local, C=CN"
          fi

      - name: Build Debug APK
        if: needs.prepare.outputs.is_debug == 'true'
        run: >
          gradle assembleDebug --no-daemon --stacktrace
          -PappVersionName=${{ needs.prepare.outputs.version_name }}
          -PappVersionCode=${{ needs.prepare.outputs.version_code }}

      - name: Rename Debug APK
        if: needs.prepare.outputs.is_debug == 'true'
        run: |
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_DST="app/build/outputs/apk/debug/Jools-debug-${{ needs.prepare.outputs.version_name }}.apk"
          mv "$APK_SRC" "$APK_DST"

      - name: Upload Debug APK Artifact
        if: needs.prepare.outputs.is_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Debug-APK
          path: app/build/outputs/apk/debug/Jools-debug-*.apk
          if-no-files-found: error

      - name: Build Release APK
        if: needs.prepare.outputs.is_debug != 'true'
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionName=${{ needs.prepare.outputs.version_name }}
          -PappVersionCode=${{ needs.prepare.outputs.version_code }}

      - name: Rename Release APK
        if: needs.prepare.outputs.is_debug != 'true'
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_DST="app/build/outputs/apk/release/Jools-${{ needs.prepare.outputs.build_type }}-${{ needs.prepare.outputs.version_name }}.apk"
          mv "$APK_SRC" "$APK_DST"
          echo "Renamed APK to $APK_DST"

      - name: Upload Release APK Artifact
        if: needs.prepare.outputs.is_debug != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-APK
          path: app/build/outputs/apk/release/Jools-*.apk
          if-no-files-found: error

  build_ios:
    name: Build iOS IPA
    needs: prepare
    runs-on: ${{ github.event.inputs.ios_runner || 'macos-26-intel' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App (Unsigned IPA)
        run: |
          xcodebuild -project ios/Jools.xcodeproj \
            -scheme Jools \
            -configuration "${{ needs.prepare.outputs.cfg }}" \
            -sdk iphoneos \
            -derivedDataPath ios_build \
            MARKETING_VERSION="${{ needs.prepare.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ needs.prepare.outputs.version_code }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p ios_ipa/Payload
          cp -R "ios_build/Build/Products/${{ needs.prepare.outputs.cfg }}-iphoneos/Jools.app" ios_ipa/Payload/
          cd ios_ipa
          zip -qry "../Jools-iOS-${{ needs.prepare.outputs.build_type }}-${{ needs.prepare.outputs.version_name }}.ipa" Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jools-iOS-IPA
          path: Jools-iOS-*.ipa
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs: [prepare, build_android, build_ios]
    if: always() && needs.prepare.outputs.is_debug != 'true' && (needs.build_android.result == 'success' || needs.build_ios.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK Artifact
        if: needs.build_android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Jools-Release-APK
          path: release_files

      - name: Download iOS IPA Artifact
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Jools-iOS-IPA
          path: release_files

      - name: Publish to GitHub Release (with Changelog)
        if: needs.prepare.outputs.has_changelog == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Jools ${{ needs.prepare.outputs.tag }}
          body: ${{ needs.prepare.outputs.changelog }}
          files: release_files/*
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false

      - name: Publish to GitHub Release (Auto Notes)
        if: needs.prepare.outputs.has_changelog != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Jools ${{ needs.prepare.outputs.tag }}
          files: release_files/*
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
