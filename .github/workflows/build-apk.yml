name: Build Android APK & iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: '填写发布版本号（如 0.2.6），将构建 Release 版 APK + IPA 并发布到 GitHub Release'
        required: true
        default: '0.2.6'
      changelog:
        description: '单行快捷更新日志（留空则自动读取仓库根目录的 CHANGELOG.md 多行文件）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
      has_changelog: ${{ steps.ver.outputs.has_changelog }}
      changelog: ${{ steps.ver.outputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve Build Version & Changelog
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          RAW="${INPUT_VERSION#v}"
          RAW="${RAW#V}"
          RAW="${RAW:-1.0.0}"
          TAG="v${RAW}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_CHANGELOG" ]; then
            FORMATTED=$(printf '%s' "$INPUT_CHANGELOG" | sed 's/；/;/g; s/;/\n- /g')
            case "$FORMATTED" in
              -*|*"\n"*) ;;
              *) FORMATTED="- $FORMATTED" ;;
            esac
            {
              echo "changelog<<EOF_CHANGELOG"
              printf '%b\n' "$FORMATTED"
              echo "EOF_CHANGELOG"
            } >> "$GITHUB_OUTPUT"
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          elif [ -f CHANGELOG.md ] && [ -s CHANGELOG.md ]; then
            {
              echo "changelog<<EOF_CHANGELOG"
              cat CHANGELOG.md
              echo ""
              echo "EOF_CHANGELOG"
            } >> "$GITHUB_OUTPUT"
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog=" >> "$GITHUB_OUTPUT"
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare CI Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
            echo "Using keystore from GitHub Secret."
          elif [ -f app/ci-release.jks ]; then
            echo "Using committed app/ci-release.jks."
          else
            keytool -genkeypair -noprompt \
              -keystore app/ci-release.jks \
              -alias toolbox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass toolbox_ci_password -keypass toolbox_ci_password \
              -dname "CN=Jools, OU=CI, O=Jools, L=Local, ST=Local, C=CN"
          fi

      - name: Build Release APK
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionName=${{ steps.ver.outputs.version_name }}
          -PappVersionCode=${{ steps.ver.outputs.version_code }}

      - name: Rename Release APK
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_DST="app/build/outputs/apk/release/Jools-release-${{ steps.ver.outputs.version_name }}.apk"
          mv "$APK_SRC" "$APK_DST"
          echo "Renamed APK to $APK_DST"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-APK
          path: app/build/outputs/apk/release/Jools-release-*.apk
          if-no-files-found: error

  build_ios:
    name: Build iOS IPA
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build & Package IPA
        working-directory: ios
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          mkdir -p build/output
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Signing IPA with personal Apple certificate..."
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > cert.p12
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

            security create-keychain -p ci_temp_pass build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci_temp_pass build.keychain
            security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci_temp_pass build.keychain

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(grep -a -A1 UUID profile.mobileprovision | grep -o '[-A-Za-z0-9]\{36\}' | head -n 1)
            cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

            xcodebuild archive \
              -project Jools.xcodeproj \
              -scheme Jools \
              -configuration Release \
              -archivePath build/Jools.xcarchive \
              MARKETING_VERSION="$VERSION_NAME" \
              CURRENT_PROJECT_VERSION="$VERSION_CODE" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$UUID"

            cat << 'EOF_EXPORT' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
          </dict>
          </plist>
          EOF_EXPORT

            xcodebuild -exportArchive \
              -archivePath build/Jools.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export

            IPA_SRC=$(ls build/export/*.ipa | head -n 1)
            cp "$IPA_SRC" "build/output/Jools-release-${VERSION_NAME}.ipa"
          else
            echo "No Apple signing secrets found; building unsigned IPA..."
            xcodebuild build \
              -project Jools.xcodeproj \
              -scheme Jools \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/derived \
              MARKETING_VERSION="$VERSION_NAME" \
              CURRENT_PROJECT_VERSION="$VERSION_CODE" \
              CODE_SIGNING_ALLOWED=NO

            mkdir -p build/Payload
            cp -R build/derived/Build/Products/Release-iphoneos/Jools.app build/Payload/
            (cd build && zip -qry "output/Jools-release-${VERSION_NAME}.ipa" Payload)
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-IPA
          path: ios/build/output/Jools-release-*.ipa
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release (APK + IPA)
    needs: [ build, build_ios ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: Jools-Release-APK
          path: release_assets

      - name: Download Release IPA
        uses: actions/download-artifact@v4
        with:
          name: Jools-Release-IPA
          path: release_assets

      - name: Publish to GitHub Release (with Changelog)
        if: needs.build.outputs.has_changelog == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Jools ${{ needs.build.outputs.tag }}
          body: ${{ needs.build.outputs.changelog }}
          files: release_assets/*
          generate_release_notes: false

      - name: Publish to GitHub Release (Auto Notes)
        if: needs.build.outputs.has_changelog != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Jools ${{ needs.build.outputs.tag }}
          files: release_assets/*
          generate_release_notes: true
