name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_version:
        description: '填写版本号（如 1.0.1）将构建 Release 版并发布到 GitHub Release；留空则仅构建 Debug 版'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve Build Mode & Version
        id: ver
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_version }}" ]; then
            RAW="${{ github.event.inputs.release_version }}"
            RAW="${RAW#v}"
            RAW="${RAW#V}"
            TAG="v${RAW}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "version_name=${RAW}" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            echo "version_name=1.0.0" >> $GITHUB_OUTPUT
          fi
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Prepare CI Signing Key
        if: steps.ver.outputs.is_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
            echo "Using keystore from GitHub Secret."
          elif [ -f app/ci-release.jks ]; then
            echo "Using committed app/ci-release.jks."
          else
            keytool -genkeypair -noprompt \
              -keystore app/ci-release.jks \
              -alias toolbox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass toolbox_ci_password -keypass toolbox_ci_password \
              -dname "CN=Jools, OU=CI, O=Jools, L=Local, ST=Local, C=CN"
          fi

      - name: Build Debug APK (on push)
        if: steps.ver.outputs.is_release != 'true'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: steps.ver.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK (on manual Run workflow)
        if: steps.ver.outputs.is_release == 'true'
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionName=${{ steps.ver.outputs.version_name }}
          -PappVersionCode=${{ steps.ver.outputs.version_code }}

      - name: Upload Release APK Artifact
        if: steps.ver.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: steps.ver.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Jools ${{ steps.ver.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
