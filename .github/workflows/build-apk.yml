name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare CI Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
            echo "Using keystore from GitHub Secret."
          elif [ -f app/ci-release.jks ]; then
            echo "Using committed app/ci-release.jks."
          else
            keytool -genkeypair -noprompt \
              -keystore app/ci-release.jks \
              -alias toolbox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass toolbox_ci_password -keypass toolbox_ci_password \
              -dname "CN=Jools, OU=CI, O=Jools, L=Local, ST=Local, C=CN"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
