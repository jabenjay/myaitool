name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate CI Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore app/ci-release.jks \
            -alias toolbox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass toolbox_ci_password -keypass toolbox_ci_password \
            -dname "CN=PocketToolbox, OU=CI, O=PocketToolbox, L=Local, ST=Local, C=CN"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jools-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
