name: Jools
options:
  bundleIdPrefix: com.jaben
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.jaben.tools
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
targets:
  Jools:
    type: application
    platform: iOS
    sources:
      - path: Jools
    info:
      path: Jools/Info.plist
      properties:
        CFBundleDisplayName: Jools
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "用于扫描二维码"
        NSPhotoLibraryUsageDescription: "用于读取图片进行格式转换与压缩"
        NSPhotoLibraryAddUsageDescription: "用于保存二维码、图片和视频到相册"
        LSApplicationQueriesSchemes:
          - alipays
          - weixin
          - mqq
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
